<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>随手记 · 个人记账本</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">¥</div>
        <div>
          <h1>随手记</h1>
          <p class="brand-sub">简单好用的个人记账本</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="exportBtn" class="btn btn-ghost" type="button">导出 CSV</button>
        <button id="resetBtn" class="btn btn-ghost danger" type="button">清空数据</button>
      </div>
    </header>

    <section class="overview">
      <div class="card balance-card">
        <span class="card-label" id="balanceLabel">本月结余</span>
        <strong class="card-value" id="balanceValue">¥0.00</strong>
        <span class="card-hint" id="balanceHint">还没有记录，先记一笔吧</span>
      </div>
      <div class="card stat-card income">
        <span class="card-label">收入</span>
        <strong class="card-value" id="incomeValue">¥0.00</strong>
        <span class="card-hint" id="incomeCount">共 0 笔</span>
      </div>
      <div class="card stat-card expense">
        <span class="card-label">支出</span>
        <strong class="card-value" id="expenseValue">¥0.00</strong>
        <span class="card-hint" id="expenseCount">共 0 笔</span>
      </div>
    </section>

    <main class="layout">
      <section class="col-left">
        <form id="entryForm" class="card form-card" autocomplete="off">
          <h2 class="card-title">记一笔</h2>

          <div class="type-toggle" role="tablist" aria-label="收支类型">
            <button type="button" class="type-btn is-active" data-type="expense" role="tab">支出</button>
            <button type="button" class="type-btn" data-type="income" role="tab">收入</button>
          </div>

          <label class="field">
            <span class="field-label">金额</span>
            <input id="amountInput" class="input input-amount" type="number" inputmode="decimal"
                   min="0" step="0.01" placeholder="0.00" required />
          </label>

          <div class="field-row">
            <label class="field">
              <span class="field-label">分类</span>
              <select id="categorySelect" class="input"></select>
            </label>
            <label class="field">
              <span class="field-label">日期</span>
              <input id="dateInput" class="input" type="date" required />
            </label>
          </div>

          <label class="field">
            <span class="field-label">备注<span class="optional">（可选）</span></span>
            <input id="noteInput" class="input" type="text" maxlength="40" placeholder="例如：午饭、地铁充值" />
          </label>

          <button type="submit" class="btn btn-primary btn-block">保存记录</button>
        </form>

        <section class="card list-card">
          <div class="list-head">
            <h2 class="card-title">明细</h2>
            <div class="filters">
              <select id="monthFilter" class="input input-sm"></select>
              <select id="categoryFilter" class="input input-sm"></select>
            </div>
          </div>
          <div id="txList" class="tx-list"></div>
          <div id="emptyState" class="empty" hidden>
            <p>当前筛选下没有记录</p>
          </div>
        </section>
      </section>

      <section class="col-right">
        <section class="card chart-card">
          <h2 class="card-title">支出构成</h2>
          <div class="chart-wrap">
            <svg id="donut" class="donut" viewBox="0 0 120 120" role="img" aria-label="支出分类占比图"></svg>
            <div id="chartEmpty" class="chart-empty" hidden>暂无支出数据</div>
          </div>
          <ul id="chartLegend" class="legend"></ul>
        </section>
      </section>
    </main>

    <footer class="app-footer">
      <p>数据仅保存在本机浏览器（localStorage），不上传服务器 · 课后练习作品，未接入任何真实用户数据</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
